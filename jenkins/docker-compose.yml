services:
  jenkins:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    # Lets the (non-root) jenkins user read/write the host's docker.sock,
    # which is group-owned by "docker" (GID 973 on this host) — avoids
    # having to run the whole container as root just for Docker CLI access.
    group_add:
      - "973"
    networks:
      default:
      # Shared with gitlab/docker-compose.yml — aliased "jenkins" so
      # GitLab's webhook can reach this container by a stable name
      # regardless of the compose-generated container name.
      citools:
        aliases:
          - jenkins

volumes:
  jenkins_home:

networks:
  citools:
    external: true
